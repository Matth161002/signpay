# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: signpay-agent

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    frontend: true
    messaging: true
  inputs:
    - name: SIGNPAY_AGENT_API_KEY
      datatype: string
      secret: true
      description: Shared authentication key for the SignPay application

models:
  default:
    provider: gateway
    models: [claude-sonnet-4-6]

dev:
  interfaces:
    frontend:
      port: 8080
    messaging:
      adapters: [web]
